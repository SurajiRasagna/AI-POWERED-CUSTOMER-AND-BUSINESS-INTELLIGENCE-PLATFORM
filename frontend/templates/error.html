<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ code }} · {{ app_name }}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Crect x='7' y='16' width='4' height='9' rx='1' fill='white'/%3E%3Crect x='14' y='10' width='4' height='15' rx='1' fill='white'/%3E%3Crect x='21' y='13' width='4' height='12' rx='1' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="error-page">
    <div class="error-card">
      <div class="error-code">{{ code }}</div>
      <h1>
        {% if code == 404 %}Page not found
        {% elif code == 403 %}Access denied
        {% elif code == 400 %}That request was not valid
        {% else %}Something went wrong{% endif %}
      </h1>
      <p>{{ message }}</p>
      <a class="btn btn-primary" href="{{ url_for('views.overview') }}">Back to dashboard</a>
    </div>
  </div>
</body>
</html>
