{% extends "auth_base.html" %}
{% block title %}Create account{% endblock %}

{% block form %}
<h2>Create your account</h2>
<p>The first account created becomes the platform administrator.</p>

<form method="post" action="{{ url_for('auth.register') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

  <div class="field">
    <label for="name">Full name</label>
    <input id="name" name="name" type="text" autocomplete="name"
           value="{{ name }}" placeholder="Suraj Kumar" required autofocus>
  </div>

  <div class="field">
    <label for="email">Work email</label>
    <input id="email" name="email" type="email" autocomplete="email"
           value="{{ email }}" placeholder="you@company.com" required>
  </div>

  <div class="field">
    <label for="password">Password</label>
    <input id="password" name="password" type="password"
           autocomplete="new-password" placeholder="At least 8 characters" required>
    <div class="password-hint">Use 8 or more characters.</div>
  </div>

  <div class="field">
    <label for="confirm_password">Confirm password</label>
    <input id="confirm_password" name="confirm_password" type="password"
           autocomplete="new-password" placeholder="Repeat your password" required>
  </div>

  <div class="form-actions">
    <button class="btn btn-primary btn-block" type="submit">Create account</button>
  </div>
</form>

<div class="auth-switch">
  Already registered? <a href="{{ url_for('auth.login') }}">Sign in</a>
</div>
{% endblock %}
